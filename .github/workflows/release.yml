name: Build and Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    env:
      HAS_APPLE_SIGNING: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Build unsigned DMG
        if: env.HAS_APPLE_SIGNING != 'true'
        run: npm run build && npx electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.notarize=false
      - name: Build signed and notarized DMG
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Kocpy-${{ matrix.arch }}
          path: release/Kocpy-*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/Kocpy-*.dmg

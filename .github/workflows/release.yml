name: Build and Stage Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HAS_APPLE_SIGNING: ${{ secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            appdir: mac-arm64
          - arch: x64
            runner: macos-15-intel
            appdir: mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify source provenance, type safety and regressions
        run: npm run verify:release && npm run typecheck && npm test
      - name: Build ad-hoc signed candidate DMG
        if: env.HAS_APPLE_SIGNING != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.notarize=false -c.mac.identity=-
      - name: Build signed and notarized DMG
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Verify complete application signature structure
        run: |
          codesign --verify --deep --strict --verbose=2 "release/${{ matrix.appdir }}/Kocpy.app"
          codesign -d --entitlements - "release/${{ matrix.appdir }}/Kocpy.app" | grep -q "com.apple.security.cs.allow-jit"
          codesign -d --entitlements - "release/${{ matrix.appdir }}/Kocpy.app" | grep -q "com.apple.security.cs.disable-library-validation"
      - name: Verify packaged native runtime with isolated synthetic media
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          mkdir -p work
          npx esbuild scripts/verify-transfer-runtime.ts --bundle --platform=node --format=cjs --outfile=work/verify-transfer-runtime.cjs
          npx esbuild scripts/verify-media-features.ts --bundle --platform=node --format=cjs --outfile=work/verify-media-features.cjs
          npx esbuild scripts/verify-proxy-delivery.ts --bundle --platform=node --format=cjs --outfile=work/verify-proxy-delivery.cjs
          npx esbuild scripts/verify-archive-evidence.ts --bundle --platform=node --format=cjs --outfile=work/verify-archive-evidence.cjs
          npx esbuild scripts/verify-completion-automation.ts --bundle --platform=node --format=cjs --outfile=work/verify-completion-automation.cjs
          npx esbuild scripts/verify-workstation-exchange.ts --bundle --platform=node --format=cjs --outfile=work/verify-workstation-exchange.cjs
          "release/${{ matrix.appdir }}/Kocpy.app/Contents/MacOS/Kocpy" work/verify-transfer-runtime.cjs
          "release/${{ matrix.appdir }}/Kocpy.app/Contents/MacOS/Kocpy" work/verify-media-features.cjs
          "release/${{ matrix.appdir }}/Kocpy.app/Contents/MacOS/Kocpy" work/verify-proxy-delivery.cjs
          "release/${{ matrix.appdir }}/Kocpy.app/Contents/MacOS/Kocpy" work/verify-archive-evidence.cjs
          "release/${{ matrix.appdir }}/Kocpy.app/Contents/MacOS/Kocpy" work/verify-completion-automation.cjs
          "release/${{ matrix.appdir }}/Kocpy.app/Contents/MacOS/Kocpy" work/verify-workstation-exchange.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kocpy-${{ matrix.arch }}
          path: release/Kocpy-*.dmg
          if-no-files-found: error
  stage:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Kocpy-*
          path: release
          merge-multiple: true
      - name: Stage both installers, exact media source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-release.mjs "${GITHUB_REF_NAME}" release
